# Windows release build: JetBox.exe, jetboxd.exe (NetBird v0.81.4 + daemon/patches) and the NSIS installer,
# fully from this repository's sources. Tag format: v<X.Y.Z>-b<build>, e.g. v1.0.2-b4.
name: windows

on:
  push:
    tags: ["v*.*.*-b*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z"
        required: true
        default: "0.0.0"
      build:
        description: "Build number"
        required: true
        default: "0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      # Reproducible build: the runner's git converts text files to CRLF by default (LICENSE, NOTICE, frontend,
      # manifests), so the same commit gave other bytes than a checkout on macOS. Keep files exactly as committed.
      - name: Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      # Exactly the Go from the `toolchain` line of go.mod — the same one local builds use (GOTOOLCHAIN in
      # app/build.sh and daemon/scripts/lib.sh).
      - name: Go toolchain version
        run: |
          go_version=$(sed -n 's/^toolchain go\([0-9.]*\)$/\1/p' go.mod)
          [ -n "$go_version" ] || { echo "no toolchain line in go.mod"; exit 1; }
          echo "GO_TOOLCHAIN=$go_version" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag=${GITHUB_REF_NAME#v}
            version=${tag%-b*}
            build=${tag##*-b}
          else
            version='${{ inputs.version }}'
            build='${{ inputs.build }}'
          fi
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $version"; exit 1; }
          printf '%s\n' "$build" | grep -Eq '^[0-9]+$' || { echo "bad build: $build"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          # One product version in every file: app, service and installer (X.Y.Z.B).
          echo "JETBOX_PRODUCT_VERSION=$version.$build" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
          cache-dependency-path: go.sum

      - name: Check Go
        run: go version | grep -F "go version go${GO_TOOLCHAIN} " || { go version; exit 1; }

      # Frontend toolchain = the release build machine (app/build.sh records both in JetBox.exe.buildinfo).
      # Node first: pnpm 11 needs Node 22.13+ and pnpm/action-setup does not install Node itself.
      # The pnpm store is cached by pnpm/action-setup (setup-node's `cache: pnpm` would need pnpm before it).
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          cache: true
          cache_dependency_path: app/frontend/pnpm-lock.yaml

      - name: Check Node and pnpm
        run: |
          [ "$(node -v)" = v26.0.0 ] || { echo "node $(node -v), want v26.0.0"; exit 1; }
          [ "$(pnpm -v)" = 11.5.0 ] || { echo "pnpm $(pnpm -v), want 11.5.0"; exit 1; }

      # Exactly NSIS 3.13, as on the Windows build machine (packaging/windows/build.sh checks the version):
      # the runner image ships its own NSIS, other versions give other installer bytes.
      - name: NSIS
        run: |
          choco install nsis --version=3.13.0 -y --no-progress --force
          echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          "/c/Program Files (x86)/NSIS/makensis.exe" -VERSION

      - name: Tests
        run: |
          sh packaging/windows/lint.sh
          (cd app/frontend && pnpm install --frozen-lockfile --ignore-scripts && pnpm build)
          # Wails with our fixes (app/wails/patches); also runs app/internal/wailscheck on Windows.
          export GOWORK=$(sh app/wails/prepare.sh)
          go vet ./core/... ./app/...
          go test -count=1 ./core/... ./app/...

      - name: Service (upstream tag + patches)
        run: sh daemon/scripts/build.sh windows

      - name: App
        run: sh app/build.sh windows "$VERSION" "$BUILD"

      - name: Installer
        run: |
          # wails3 CLI only extracts the Microsoft WebView2 bootstrapper (same as upstream NetBird CI).
          (cd "$RUNNER_TEMP" && GOBIN="$RUNNER_TEMP/bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3)
          WAILS3="$RUNNER_TEMP/bin/wails3.exe" sh packaging/windows/build.sh "$VERSION" "$BUILD"

      - name: Checksums
        run: |
          cd build-out/windows-amd64
          sha256sum JetBox.exe jetboxd.exe JetBox-Setup.exe | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: jetbox-windows-${{ env.VERSION }}-b${{ env.BUILD }}
          path: |
            build-out/windows-amd64/JetBox.exe
            build-out/windows-amd64/jetboxd.exe
            build-out/windows-amd64/JetBox-Setup.exe
            build-out/windows-amd64/SHA256SUMS
            build-out/windows-amd64/*.buildinfo
          if-no-files-found: error
